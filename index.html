<!DOCTYPE html>
<html lang="ro">
<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&display=swap">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
  <style>
  body {
    font-family: system-ui, sans-serif;

    background: #000000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .box {
    text-align: center;
    max-width: 600px;
    padding: 32px;
    border-radius: 16px;
    background: #000000;
  }
  .zap {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 24px;
    font-weight: 400;
}
  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;   /* ← dublu față de 8px */
    opacity: 0.9;
}
.footer a {
    color: #193433;                          /* verde închis din poză */
    text-decoration: none;
    border-bottom: 1px solid rgba(25,52,51,0.4);  /* aceeași culoare, 40% */
}
.footer a:hover {
    border-bottom-color: #193433;
}

</head>
<body>
  <div class="box">
    <h1 class="zap">Când poți să refuzi e obligatoriu.</h1>

    <p class="footer">
      <a href="mailto:nicky@scurtpedoi.com">nicky@scurtpedoi.com</a>
