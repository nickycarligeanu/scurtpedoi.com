<!DOCTYPE html>
<html lang="ro">
<head>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
  <style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: #1E3A39;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .box {
    text-align: center;
    max-width: 600px;
    padding: 32px;
    border-radius: 16px;
    background: #1E3A39;
  }
  .zap {
    font-family: "Great Vibes", cursive;
    font-size: 48px;
}
  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 8px;
    opacity: 0.9;
  }
  .footer a {
    color: #ffffff;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.4);
  }
  .footer a:hover {
    border-bottom-color: #ffffff;
  }
  </style>
</head>
<body>
  <div class="box">
    <h1 class="zap">Când poți să refuzi e obligatoriu.</h1>

    <p class="footer">
      <a href="mailto:nicky@scurtpedoi.com">nicky@scurtpedoi.com</a>

</html>
